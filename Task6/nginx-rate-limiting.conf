# Конфигурация Nginx с Rate Limiting для InsureTech API
# Защита от перегрузки одним из партнеров

http {
    # ========================================
    # ОПРЕДЕЛЕНИЕ ЗОН RATE LIMITING
    # ========================================

    # Зона для ограничения количества запросов
    # Ключ: IP-адрес клиента ($binary_remote_addr)
    # Размер зоны: 10 МБ (достаточно для ~160,000 IP адресов)
    # Лимит: 10 запросов в минуту (10r/m)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

    # Дополнительная зона для более гибкого ограничения по API-ключу
    # Используется для идентификации конкретного партнера
    # Ключ: API-ключ из заголовка X-API-Key
    limit_req_zone $http_x_api_key zone=partner_limit:10m rate=20r/m;

    # Зона для ограничения количества соединений
    # Лимит одновременных соединений от одного IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========================================
    # ЛОГИРОВАНИЕ RATE LIMITING
    # ========================================

    # Уровень логирования для rate limiting (warn вместо error)
    # Позволяет отслеживать случаи превышения лимита без заполнения error.log
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Кастомный формат лога для отслеживания rate limiting
    log_format rate_limited '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time limit=$limit_req_status';

    # ========================================
    # UPSTREAM (BACKEND СЕРВЕРЫ)
    # ========================================

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        # Least connections - направлять на сервер с наименьшим количеством активных соединений
        least_conn;

        server backend1.example.com weight=1 max_fails=3 fail_timeout=30s;
        server backend2.example.com weight=1 max_fails=3 fail_timeout=30s;
        server backend3.example.com weight=1 max_fails=3 fail_timeout=30s;

        # Keep-alive соединения для повышения производительности
        keepalive 32;
    }

    # ========================================
    # SERVER CONFIGURATION
    # ========================================

    server {
        listen 80;
        server_name api.insuretech.example.com;

        # Логи с кастомным форматом для rate limiting
        access_log /var/log/nginx/access.log rate_limited;
        error_log /var/log/nginx/error.log warn;

        # ========================================
        # RATE LIMITING LOCATION
        # ========================================

        location / {
            # ----------------------------------------
            # ОСНОВНОЕ ОГРАНИЧЕНИЕ: 10 ЗАПРОСОВ В МИНУТУ
            # ----------------------------------------

            # Применяем rate limiting из зоны api_limit
            # burst=20 - разрешить "всплеск" до 20 запросов (сверх лимита)
            # nodelay - не задерживать запросы в пределах burst
            # Итого: клиент может сделать 10 req/min + burst 20 = максимум 30 запросов сразу,
            # но затем будет ограничен до 10 req/min
            limit_req zone=api_limit burst=20 nodelay;

            # ----------------------------------------
            # ОГРАНИЧЕНИЕ ОДНОВРЕМЕННЫХ СОЕДИНЕНИЙ
            # ----------------------------------------

            # Максимум 10 одновременных соединений от одного IP
            limit_conn conn_limit 10;

            # ----------------------------------------
            # HTTP-ОШИБКА 429 ПРИ ПРЕВЫШЕНИИ ЛИМИТА
            # ----------------------------------------

            # Статус-код 429 (Too Many Requests) возвращается при превышении лимита
            # Это настраивается через директиву limit_req_status
            limit_req_status 429;
            limit_conn_status 429;

            # ----------------------------------------
            # ДОПОЛНИТЕЛЬНЫЕ ЗАГОЛОВКИ ДЛЯ RATE LIMITING
            # ----------------------------------------

            # Добавляем заголовки для информирования клиента о лимитах
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Remaining "$limit_req_remaining" always;
            add_header Retry-After "60" always;

            # ----------------------------------------
            # ПРОКСИ К BACKEND СЕРВЕРАМ
            # ----------------------------------------

            # Проксирование запроса к backend серверам
            proxy_pass http://backend_servers;

            # Передача оригинальных заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для предотвращения зависания
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Буферизация для улучшения производительности
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Keep-alive для upstream соединений
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================
        # СПЕЦИАЛЬНЫЙ LOCATION ДЛЯ ПАРТНЕРОВ
        # ========================================

        # Для известных партнеров с API-ключами можно применить отдельные лимиты
        location /api/partner {
            # Rate limiting по API-ключу (20 запросов в минуту для партнеров)
            limit_req zone=partner_limit burst=30 nodelay;
            limit_req_status 429;

            # Проверка наличия API-ключа
            if ($http_x_api_key = "") {
                return 401 "API Key required";
            }

            # Добавляем заголовки
            add_header X-RateLimit-Limit "20" always;
            add_header Retry-After "60" always;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # ========================================
        # HEALTH CHECK ENDPOINT (БЕЗ RATE LIMITING)
        # ========================================

        location /health {
            # Health check не должен подпадать под rate limiting
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ========================================
        # КАСТОМНАЯ СТРАНИЦА ОШИБКИ 429
        # ========================================

        error_page 429 /429.html;
        location = /429.html {
            internal;
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Maximum 10 requests per minute allowed.", "retry_after": 60}';
        }

        # ========================================
        # КАСТОМНЫЕ СТРАНИЦЫ ОШИБОК
        # ========================================

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            default_type application/json;
            return 503 '{"error": "Service Unavailable", "message": "Backend servers are temporarily unavailable."}';
        }
    }

    # ========================================
    # ДОПОЛНИТЕЛЬНАЯ КОНФИГУРАЦИЯ ДЛЯ МОНИТОРИНГА
    # ========================================

    # Сервер для мониторинга и статистики (только для внутренней сети)
    server {
        listen 8080;
        server_name localhost;

        # Разрешить доступ только с localhost или из внутренней сети
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
